name: Rust and app checks

on:
  push:
    branches: [rustedition-dev]
  pull_request:
    branches: [rustedition-dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests and WebAssembly compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Run native Rust tests
        run: cargo test --manifest-path rust/tyre-kernel/Cargo.toml
      - name: Compile optimized WebAssembly module
        run: cargo build --manifest-path rust/tyre-kernel/Cargo.toml --release --target wasm32-unknown-unknown
      - name: Upload Rust WebAssembly build
        uses: actions/upload-artifact@v4
        with:
          name: librecorsa-rust-wasm
          path: rust/tyre-kernel/target/wasm32-unknown-unknown/release/librecorsa_tyre_kernel.wasm
          if-no-files-found: error

  app:
    name: TypeScript checks and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check the original game
        run: npm run typecheck
      - name: Verify simulation worker parity
        run: node --disable-warning=THREE_CJS_DEPRECATED --import tsx scripts/verify-sim-runtime.ts
      - name: Verify tyre thermal model
        run: node --import tsx scripts/verify-tyre-thermal.ts
      - name: Verify tyre pressure model
        run: node --import tsx scripts/verify-tyre-pressure.ts
      - name: Build the original game
        run: npm run build
      - name: Upload complete static game build
        uses: actions/upload-artifact@v4
        with:
          name: librecorsa-rustedition-static
          path: out/
          if-no-files-found: error
