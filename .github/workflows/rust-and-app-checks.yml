name: Rust and app checks

on:
  push:
    branches: [rustedition-dev]
  pull_request:
    branches: [rustedition-dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests and WebAssembly compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Run native Rust tests
        run: cargo test --manifest-path rust/tyre-kernel/Cargo.toml
      - name: Compile optimized WebAssembly module
        run: cargo build --manifest-path rust/tyre-kernel/Cargo.toml --release --target wasm32-unknown-unknown
      - name: Upload Rust WebAssembly build
        uses: actions/upload-artifact@v4
        with:
          name: librecorsa-rust-wasm
          path: rust/tyre-kernel/target/wasm32-unknown-unknown/release/librecorsa_tyre_kernel.wasm
          if-no-files-found: error

  app:
    name: TypeScript checks and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check the original game
        run: npm run typecheck
      - name: Verify simulation worker parity
        run: node --disable-warning=THREE_CJS_DEPRECATED --import tsx scripts/verify-sim-runtime.ts
      # The full thermal stint suite is intentionally run separately: it simulates several complete race stints and is too slow for every build.
      - name: Verify tyre pressure model
        run: node --import tsx scripts/verify-tyre-pressure.ts
      - name: Build the original game
        run: npm run build
      - name: Upload complete static game build
        uses: actions/upload-artifact@v4
        with:
          name: librecorsa-rustedition-static
          path: out/
          if-no-files-found: error

  desktop-android:
    name: Package Android ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Configure Android NDK path
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: npm ci
      - name: Build the game frontend
        run: npm run build
      - name: Prepare Android app icon
        run: |
          mkdir -p src-tauri/icons
          cp public/branding/apple-touch-icon.png src-tauri/icons/icon.png
      - name: Initialize the Tauri Android project
        run: npx --yes @tauri-apps/cli@2.12.2 android init --ci
      - name: Build ARM64 APK for Android phones
        run: npx --yes @tauri-apps/cli@2.12.2 android build --ci --apk --target aarch64
      - name: Sign installable Android APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/librecorsa-debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=LibreCorsa-Rustedition Debug,O=LibreCorsa,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          mkdir -p dist
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/librecorsa-debug.keystore" \
            --ks-pass pass:android --key-pass pass:android \
            --out "dist/LibreCorsa-Rustedition-android-arm64.apk" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "dist/LibreCorsa-Rustedition-android-arm64.apk"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: LibreCorsa-Rustedition-Android-ARM64
          path: dist/LibreCorsa-Rustedition-android-arm64.apk
          if-no-files-found: error

  desktop-windows:
    name: Package Windows desktop executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build the original game frontend
        run: npm run build
      - name: Prepare Windows app icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/icons | Out-Null
          Copy-Item public/favicon.ico src-tauri/icons/icon.ico
      - name: Build Windows installer and executable
        run: npx --yes @tauri-apps/cli@2.12.2 build --bundles nsis
      - name: Upload Windows desktop builds
        uses: actions/upload-artifact@v4
        with:
          name: librecorsa-windows-desktop
          path: |
            src-tauri/target/release/librecorsa-desktop.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
