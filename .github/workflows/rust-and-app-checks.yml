name: Rust and app checks

on:
  push:
    branches: [rustedition-dev]
  pull_request:
    branches: [rustedition-dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests and WebAssembly compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Run native Rust tests
        run: cargo test --manifest-path rust/tyre-kernel/Cargo.toml
      - name: Compile optimized WebAssembly module
        run: cargo build --manifest-path rust/tyre-kernel/Cargo.toml --release --target wasm32-unknown-unknown
      - name: Upload Rust WebAssembly build
        uses: actions/upload-artifact@v4
        with:
          name: librecorsa-rust-wasm
          path: rust/tyre-kernel/target/wasm32-unknown-unknown/release/librecorsa_tyre_kernel.wasm
          if-no-files-found: error

  app:
    name: TypeScript checks and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check the original game
        run: npm run typecheck
      - name: Verify simulation worker parity
        run: node --disable-warning=THREE_CJS_DEPRECATED --import tsx scripts/verify-sim-runtime.ts
      # The full thermal stint suite is intentionally run separately: it simulates several complete race stints and is too slow for every build.
      - name: Verify tyre pressure model
        run: node --import tsx scripts/verify-tyre-pressure.ts
      - name: Build the original game
        run: npm run build
      - name: Upload complete static game build
        uses: actions/upload-artifact@v4
        with:
          name: librecorsa-rustedition-static
          path: out/
          if-no-files-found: error

  desktop-windows:
    name: Package Windows desktop executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build the original game frontend
        run: npm run build
      - name: Prepare Windows app icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/icons | Out-Null
          Copy-Item public/favicon.ico src-tauri/icons/icon.ico
      - name: Build Windows installer and executable
        run: npx --yes @tauri-apps/cli@2.12.2 build --bundles nsis
      - name: Upload Windows desktop builds
        uses: actions/upload-artifact@v4
        with:
          name: librecorsa-windows-desktop
          path: |
            src-tauri/target/release/librecorsa-desktop.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
